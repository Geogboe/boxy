# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BETTERLEAKS_VERSION: v1.8.1
  BETTERLEAKS_PII_CONFIG: .betterleaks-pii.toml
  GOLANGCI_LINT_VERSION: v2.12.2

tasks:
  agent:go-test:
    desc: Run a Go test command with a repo-local report and focused failure diagnostics
    requires:
      vars: [NAME, PACKAGES]
    cmds:
      - task: agent:go-test:windows
        vars:
          NAME: '{{.NAME}}'
          PACKAGES: '{{.PACKAGES}}'
      - task: agent:go-test:unix
        vars:
          NAME: '{{.NAME}}'
          PACKAGES: '{{.PACKAGES}}'

  agent:go-test:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name '{{.NAME}}' -Executable go test {{.PACKAGES}}

  agent:go-test:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh '{{.NAME}}' go test {{.PACKAGES}}

  agent:gopls:
    desc: Run gopls diagnostics with a repo-local report and focused failure diagnostics
    requires:
      vars: [NAME, FILES]
    cmds:
      - task: agent:gopls:windows
        vars:
          NAME: '{{.NAME}}'
          FILES: '{{.FILES}}'
      - task: agent:gopls:unix
        vars:
          NAME: '{{.NAME}}'
          FILES: '{{.FILES}}'

  agent:gopls:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name '{{.NAME}}' -Executable gopls check {{.FILES}}

  agent:gopls:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh '{{.NAME}}' gopls check {{.FILES}}

  agent:check:go:
    desc: Check release Go changes with gopls
    cmds:
      - task: agent:gopls
        vars:
          NAME: gopls-release
          FILES: internal/server/execution_manager.go internal/server/api_exec.go internal/server/api_catalog.go internal/server/api_pools.go internal/server/server.go internal/server/session.go internal/server/oidc.go internal/server/ui.go internal/server/ui_pools.go internal/cli/sandbox_exec.go internal/cli/sandbox_exec_test.go internal/cli/exit_code_test.go internal/config/config.go internal/config/config_test.go pkg/model/execution.go pkg/store/store.go pkg/store/memory.go pkg/store/disk.go pkg/providersdk/driver.go pkg/providersdk/guest_personalization.go pkg/providersdk/providers/docker/driver.go pkg/providersdk/providers/hyperv/driver.go pkg/providersdk/providers/devfactory/driver.go pkg/psdirect/psdirect.go pkg/psdirect/psdirect_test.go pkg/agentsdk/remoteclient.go pkg/agentsdk/remoteclient_test.go pkg/vmsdk/guest.go internal/pool/reconcile.go internal/pool/reconcile_test.go

  agent:test:execution:
    desc: Run execution tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-execution
          PACKAGES: ./pkg/store ./internal/server

  agent:test:cli:
    desc: Run CLI tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-cli
          PACKAGES: ./internal/cli

  agent:test:pool:
    desc: Run pool reconciliation tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-pool
          PACKAGES: ./internal/pool

  agent:test:server:
    desc: Run server and UI tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-server
          PACKAGES: ./internal/server

  agent:test:psdirect:
    desc: Run PowerShell Direct and multiline regression tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-psdirect
          PACKAGES: ./pkg/psdirect

  agent:test:providers:
    desc: Run provider and agent SDK tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-providers
          PACKAGES: ./pkg/providersdk/... ./pkg/agentsdk/... ./pkg/vmsdk/...

  agent:generate:
    desc: Regenerate checked-in artifacts with captured diagnostics
    cmds:
      - task: agent:generate:windows
      - task: agent:generate:unix

  agent:generate:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name generate -Executable task generate

  agent:generate:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh generate task generate

  agent:test:oidc:
    desc: Run configuration and OIDC server tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-oidc
          PACKAGES: ./internal/config ./internal/server

  agent:test:all:
    desc: Run the complete Go test suite with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-all
          PACKAGES: ./...

  agent:test:installers:
    desc: Run installer tests with captured diagnostics
    cmds:
      - task: agent:go-test
        vars:
          NAME: test-installers
          PACKAGES: ./scripts

  agent:test:race:
    desc: Run the platform-appropriate race suite with captured diagnostics
    cmds:
      - task: agent:test:race:windows
      - task: agent:test:race:unix

  agent:ci:validate:
    desc: Run the complete CI validation with captured diagnostics
    cmds:
      - task: agent:ci:validate:windows
      - task: agent:ci:validate:unix

  agent:ci:validate:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name ci-validate -Executable task ci:validate

  agent:ci:validate:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh ci-validate task ci:validate

  agent:test:race:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name test-race -Executable wsl.exe --cd "{{.ROOT_DIR}}" bash -lc "./scripts/ci-race.sh"

  agent:test:race:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh test-race go test -race -short ./...
      - bash scripts/agent-check.sh test-race-cli go test -race -short -tags devtools ./internal/cli/...

  agent:e2e:serve:
    desc: Run serve API/UI E2E validation with captured diagnostics
    cmds:
      - task: agent:e2e:serve:windows
      - task: agent:e2e:serve:unix

  agent:e2e:serve:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name e2e-serve -Executable wsl.exe --cd "{{.ROOT_DIR}}" bash -lc "./scripts/e2e-serve.sh {{.CLI_ARGS}}"

  agent:e2e:serve:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh e2e-serve bash scripts/e2e-serve.sh {{.CLI_ARGS}}

  agent:act:
    desc: Run one reproducible GitHub Actions job locally with captured diagnostics
    requires:
      vars: [JOB]
    cmds:
      - task: agent:act:windows
        vars:
          JOB: "{{.JOB}}"
      - task: agent:act:unix
        vars:
          JOB: "{{.JOB}}"

  agent:act:windows:
    platforms: [windows]
    internal: true
    silent: true
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name "act-{{.JOB}}" -Executable wsl.exe --cd "{{.ROOT_DIR}}" bash -lc "act -j '{{.JOB}}' --platform 'ubuntu-latest=catthehacker/ubuntu:act-latest' --matrix os:ubuntu-latest --concurrent-jobs 1"

  agent:act:unix:
    platforms: [linux, darwin]
    internal: true
    silent: true
    cmds:
      - bash scripts/agent-check.sh "act-{{.JOB}}" act -j "{{.JOB}}" --concurrent-jobs 1

  agent:act:ci:
    desc: Run all Linux-reproducible CI jobs locally with act
    cmds:
      - task: agent:act
        vars: {JOB: lint}
      - task: agent:act
        vars: {JOB: test}
      - task: agent:act
        vars: {JOB: installer-smoke}
      - task: agent:act
        vars: {JOB: build}
      - task: agent:act
        vars: {JOB: betterleaks}
      - task: agent:act
        vars: {JOB: pii}

  agent:scan:secrets:
    desc: Run the Betterleaks secret scan with captured diagnostics
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name secrets-scan -Executable task --silent secrets:scan

  agent:scan:pii:
    desc: Run the Betterleaks PII scan with captured diagnostics
    cmds:
      - pwsh -NoProfile -File scripts/agent-check.ps1 -Name pii-scan -Executable task --silent pii:scan

  default: task --list

  go:run:
    desc: Run `boxy` via `go run`
    aliases:
      - run
    dir: "{{.ROOT_DIR}}"
    env:
      BOXY_WORKING_DIR: "{{.USER_WORKING_DIR}}"
    cmds:
      - go run ./cmd/boxy {{.CLI_ARGS}}

  serve:
    desc: Run `boxy serve` via `go run`
    cmds:
      - go run ./cmd/boxy serve {{.CLI_ARGS}}

  serve:once:
    desc: Run `boxy serve --once` via `go run`
    cmds:
      - go run ./cmd/boxy serve --once {{.CLI_ARGS}}

  build:
    desc: Build local ./boxy binary
    cmds:
      - go build -o ./boxy ./cmd/boxy

  install:
    desc: Install `boxy` into GOBIN/GOPATH/bin
    cmds:
      - go install ./cmd/boxy

  test:
    desc: Run all Go tests
    aliases:
      - t
    cmds:
      - go test ./...

  test:ci:
    desc: Run the CI race, short, and devtools test matrix locally
    cmds:
      - cmd: wsl.exe --cd "{{.ROOT_DIR}}" bash -lc "./scripts/ci-race.sh"
        if: '{{eq OS "windows"}}'
      - cmd: go test -race -short ./...
        if: '{{ne OS "windows"}}'
      - cmd: go test -race -short -tags devtools ./internal/cli/...
        if: '{{ne OS "windows"}}'

  test:cli:
    desc: Run CLI package tests
    cmds:
      - go test ./internal/cli

  test:execution:
    desc: Run focused durable-execution and persistence tests
    cmds:
      - go test ./pkg/store ./internal/server

  test:durable:
    desc: Run the durable execution acceptance tests
    cmds:
      - go test ./internal/server -run '^TestDurableExec'

  skills:check:
    desc: Run bundled skill drift and installer checks
    cmds:
      - go test ./internal/skills ./internal/cli -run 'TestBundledSkillMentionsAllCommands|TestSkillsInstall_|TestSkillsUninstall_|TestHelpAllPrintsNewCommands|TestRunUpdate_RefreshesCanonicalSkillAfterInstall'

  skills:install:dev:
    desc: Install the bundled skill into a local temp directory for manual inspection
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go run ./cmd/boxy skills install --path ./.tmp/skills --force

  test:installers:
    desc: Run installer smoke tests
    aliases:
      - test:scripts
    cmds:
      - go test ./scripts -count=1

  test:installers:wsl:
    desc: Run the opt-in WSL installer smoke test
    platforms: [windows]
    env:
      BOXY_TEST_WSL: "1"
    cmds:
      - go test ./scripts -run TestInstallShWSL -count=1

  generate:
    desc: Run go generate (schemas, installers, and API documentation)
    aliases:
      - gen
    cmds:
      - go generate ./...

  fmt:
    desc: Format all Go source files
    aliases: [format]
    cmd: gofmt -w .

  # golangci-lint's build-tag-sensitive checks (e.g. `unused`) only see the
  # invoking host's own GOOS. CI's Lint job always runs on ubuntu-latest, so
  # a Windows or macOS host running `go run .../golangci-lint@version run
  # ./...` (host GOOS) can pass locally while CI fails on GOOS-gated code —
  # this is exactly how three Windows-only-consumed methods in
  # pkg/secrets/secrets.go shipped past local lint and broke CI (#197, fixed
  # here). Install natively (go run can't cross-compile-then-exec itself),
  # then invoke with GOOS=linux so the *analysis* always matches CI's runner
  # regardless of host OS; Task's shell interpreter supports the env-var-
  # prefix form cross-platform, including on Windows.
  lint:
    desc: Run golangci-lint the same way CI does (GOOS=linux, matching the ubuntu-latest runner, regardless of host OS)
    aliases: [lint:go, golangci-lint]
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - GOOS=linux golangci-lint run ./...

  ci:validate:
    desc: Run all CI-equivalent checks locally before pushing
    preconditions:
      - sh: git diff --quiet HEAD
        msg: ci:validate requires a clean tracked worktree; commit or stash changes first.
    cmds:
      - task: test
      - task: test:ci
      - task: lint
      - task: test:installers
      - task: build
      - task: secrets:scan
      - task: pii:scan
      - task: generate
      - cmd: git diff --check
      - cmd: git diff --exit-code

  # Native ARM64 Git for Windows rejects the NUL config paths Betterleaks uses
  # to isolate global/system Git config. The Windows wrapper keeps the full
  # history scan and only fixes those child Git environment values.
  secrets:install:
    desc: Install the pinned Betterleaks version
    cmds:
      - go install github.com/betterleaks/betterleaks@{{.BETTERLEAKS_VERSION}}

  secrets:scan:
    desc: Scan git history for secrets with Betterleaks
    deps:
      - secrets:install
    cmds:
      - cmd: pwsh -NoProfile -File scripts/betterleaks-git.ps1
        if: '{{eq OS "windows"}}'
      - cmd: betterleaks git . --no-banner --redact --log-opts HEAD
        if: '{{ne OS "windows"}}'

  pii:scan:
    desc: Scan git history for non-controlled PII with Betterleaks
    deps:
      - secrets:install
    cmds:
      - cmd: pwsh -NoProfile -File scripts/betterleaks-git.ps1 {{.BETTERLEAKS_PII_CONFIG}}
        if: '{{eq OS "windows"}}'
      - cmd: betterleaks git . --config {{.BETTERLEAKS_PII_CONFIG}} --no-banner --redact --log-opts HEAD
        if: '{{ne OS "windows"}}'

  pii:scan:stdin:
    desc: Scan piped public text for non-controlled PII with Betterleaks
    deps:
      - secrets:install
    cmds:
      - betterleaks stdin --config {{.BETTERLEAKS_PII_CONFIG}} --no-banner --redact

  pii:authors:
    desc: Report Git author identities for non-blocking PII review
    cmds:
      - git log --all --format="%an <%ae>"

  proto:generate:
    desc: Generate gRPC/protobuf Go stubs from proto/ using the pinned buf CLI
    env:
      # `-modfile` doesn't participate in Go's automatic toolchain switching,
      # so on a machine whose default `go` predates tools/go.mod's `go`
      # directive, resolving the module graph fails with a misleading
      # "requires go >= ..." error even though the right toolchain would
      # auto-download fine if invoked from within tools/ directly. Pin it
      # explicitly here instead of requiring a matching local Go install.
      GOTOOLCHAIN: go1.26.1
    cmds:
      - go run -modfile=tools/go.mod github.com/bufbuild/buf/cmd/buf generate

  proto:lint:
    desc: Lint proto/ using the pinned buf CLI
    env:
      GOTOOLCHAIN: go1.26.1
    cmds:
      - go run -modfile=tools/go.mod github.com/bufbuild/buf/cmd/buf lint

  release:check:
    desc: Validate GoReleaser config using the pinned tools module
    cmds:
      - go run -modfile=tools/go.mod github.com/goreleaser/goreleaser/v2 check --config .goreleaser.yml

  release:snapshot:
    desc: Run a local GoReleaser snapshot build using the pinned tools module
    cmds:
      - go run -modfile=tools/go.mod github.com/goreleaser/goreleaser/v2 release --snapshot --clean --config .goreleaser.yml

  kill:boxy:
    desc: Kill any running boxy processes (Windows only, requires pwsh)
    platforms: [windows]
    cmds:
      - pwsh -Command "Get-Process -Name boxy -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host 'Done'"

  e2e:serve:
    desc: E2E validation of boxy serve (API + UI)
    cmds:
      - cmd: wsl.exe --cd "{{.ROOT_DIR}}" bash -lc "./scripts/e2e-serve.sh {{.CLI_ARGS}}"
        if: '{{eq OS "windows"}}'
      - cmd: bash scripts/e2e-serve.sh {{.CLI_ARGS}}
        if: '{{ne OS "windows"}}'

  test:e2e:browser:
    desc: Run Firefox browser coverage for the dashboard
    dir: ./tests/e2e
    cmds:
      - npm test -- --reporter=line
