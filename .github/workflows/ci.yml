# CI runs for ready PRs targeting main, merge queues, and main updates.
# Draft PR events create skipped checks without allocating runners.
#
# All third-party actions are pinned to a full commit SHA (not a mutable tag)
# per #55. Dependabot (.github/dependabot.yml) opens PRs to bump these pins.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Detects whether a push/PR touches anything besides prose docs, so the
    # expensive Go jobs below (lint/test/build/installer-smoke) can skip for
    # a docs-only change instead of running the full multi-platform matrix
    # for, say, one ADR file. Betterleaks/Betterleaks PII stay unconditional
    # below -- they're cheap (sub-second full-history scans) and are exactly
    # the tool that needs to see prose/doc content, so skipping them for
    # docs changes would be backwards.
    #
    # `non_code` is a positive `**` baseline minus an explicit, conservative
    # allow-list of prose paths. Both halves matter: paths-filter's default
    # `predicate-quantifier: 'some'` includes a file if it matches AT LEAST
    # ONE pattern and does NOT treat `!` patterns as subtractive, so a
    # negation-only filter matches everything and never skips (which is how
    # this shipped broken in #375 -- the gate was a silent no-op). The
    # `some-with-excludes` quantifier is what makes `!` actually exclude.
    #
    # So it's true (meaning "something beyond the safe list changed")
    # whenever ANY changed file falls outside the allow-list, including any
    # doc path not listed here. That's deliberate: an unlisted path defaults
    # to running full CI (today's status quo), never to silently skipping
    # it. The list is
    # deliberately narrower than "all of docs/" -- docs/ui-design-language.md,
    # docs/help/index.md, docs/api.md, and README.md are read directly by Go
    # tests (internal/server/ui_design_test.go, cmd/help-gen/main_test.go,
    # cmd/api-doc-gen/main_test.go, internal/server/dashboard_asset_test.go)
    # and must keep triggering the Test job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    outputs:
      non_code: ${{ steps.filter.outputs.non_code }}
    steps:
      # paths-filter reads changed files from the GitHub API on pull_request
      # events but from local git history on push and merge_group events, so
      # it needs a checkout. Without one, every push to main failed this job
      # ("not a git repository") and skipped every job gated on it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            non_code:
              - '**'
              - '!docs/adr/**'
              - '!docs/superpowers/**'
              - '!docs/current-delivery-notes.md'
              - '!docs/ci-cd-workflow.md'
              - '!docs/cli-wireframe.md'
              - '!docs/windows-allocation-performance.md'
              - '!docs/diagnostics-performance.md'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!LICENSE'

  lint:
    if: needs.changes.outputs.non_code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Build from source so golangci-lint and Go versions always match.
      # The golangci-lint-action pre-built binary lags behind Go releases.
      # Pin the latest release compatible with this repository's Go 1.25 toolchain.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    if: needs.changes.outputs.non_code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -short ./...

      # debug_provider*.go (internal/cli) is only compiled with -tags devtools
      # (see #68); run it too so that code path still has CI coverage.
      - name: Run tests (devtools build tag)
        run: go test -race -short -tags devtools ./internal/cli/...

  installer-smoke:
    if: needs.changes.outputs.non_code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    name: Installer Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run installer smoke tests
        run: go test ./scripts -count=1

  build:
    if: needs.changes.outputs.non_code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/boxy

  betterleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Betterleaks v1.8.1
        run: go install github.com/betterleaks/betterleaks@v1.8.1

      - name: Scan git history for secrets
        run: betterleaks git . --no-banner --redact --log-opts HEAD

  pii:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Betterleaks PII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Betterleaks v1.8.1
        run: go install github.com/betterleaks/betterleaks@v1.8.1

      - name: Scan git history for non-controlled PII
        run: betterleaks git . --config .betterleaks-pii.toml --no-banner --redact --log-opts HEAD
