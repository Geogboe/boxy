syntax = "proto3";

package boxyagent.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/Geogboe/boxy/pkg/agentproto/boxyagentv1;boxyagentv1";

// AgentTransport is the single service a remote boxy agent uses to
// communicate with a boxy server. The agent dials out and opens exactly one
// long-lived bidirectional stream per connection (NAT/firewall-friendly);
// the server pushes Commands down that same stream and reads CommandResults
// back. See docs/adr/0005-remote-agent-transport-and-registration.md.
service AgentTransportService {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  rpc ResolveGuestBootstrapCredential(ResolveGuestBootstrapCredentialRequest)
      returns (ResolveGuestBootstrapCredentialResponse);
}

message ResolveGuestBootstrapCredentialRequest {
  string resource_id = 1;
}

message ResolveGuestBootstrapCredentialResponse {
  string username = 1;
  string password = 2;
}

// ---- Agent -> Server ----

message AgentMessage {
  oneof payload {
    RegisterRequest register = 1;  // sent once, first frame only
    Heartbeat heartbeat = 2;       // sent periodically
    CommandResult result = 3;      // sent in response to a pushed Command
    LogBatch log_batch = 4;         // bounded, sanitized agent diagnostics
  }
}

message RegisterRequest {
  // registration_token is the single-use bootstrap token minted via
  // `boxy agent token create`. Empty on a cert-based reconnect, where the
  // mTLS handshake has already authenticated the agent.
  string registration_token = 1;
  string agent_name = 2;
  repeated string provider_types = 3;
  string agent_version = 4;

  // network_isolating_provider_types is the subset of provider_types whose
  // local driver on this agent actually implements
  // providersdk.NetworkIsolator. It exists because the daemon cannot
  // type-assert a remote agent's driver: agentsdk.NetworkIsolatingAgent is
  // implemented unconditionally by both EmbeddedAgent and RemoteAgent, so
  // without this advertisement the control plane only discovers "this
  // driver can't isolate" as a hard error three layers down, after it has
  // already committed to creating a segment. Empty means "none" — the
  // correct default for an agent hosting only non-isolating drivers. The
  // server trusts no entry here that is absent from provider_types, the
  // same anti-spoofing posture Heartbeat.availability already uses.
  repeated string network_isolating_provider_types = 5;
}

message Heartbeat {
  string agent_id = 1;
  int64 unix_time = 2;
  repeated string provider_types = 3;  // re-advertised in case of runtime capability change

  // availability is this agent's best-effort, per-provider
  // providersdk.AvailabilityReporter sample, taken just before this
  // Heartbeat was sent. A provider_type advertised above with no
  // corresponding entry here means its driver has no reporter, the reporter
  // errored, or sampling hit its bounded deadline — never "zero
  // availability". The server trusts neither agent_id nor a provider_type
  // absent from this connection's registered provider_types (see
  // docs/adr/0005-remote-agent-transport-and-registration.md).
  repeated ProviderAvailability availability = 4;
}

// ProviderAvailability is one provider driver's point-in-time resource
// headroom, carried per-provider (never a single ambiguous global value)
// because one agent can host multiple provider types with independent
// capacity.
message ProviderAvailability {
  string provider_type = 1;
  int64 memory_mb = 2;
}

message CommandResult {
  string command_id = 1;  // correlates back to Command.command_id
  oneof outcome {
    ResourceResult resource = 2;
    ResourceStatusResult status = 3;
    OperationResult operation = 4;
    google.protobuf.Empty deleted = 5;
    AllocateResult allocate = 6;
    AgentError error = 7;
    ListResult list = 8;
    PersonalizeGuestResult personalize_guest = 9;
    OperationStreamEvent operation_stream = 10;
    CreateSegmentResult create_segment = 11;
    google.protobuf.Empty attach_to_segment = 12;
    google.protobuf.Empty destroy_segment = 13;
    MeshIdentityResult mesh_identity = 14;
    google.protobuf.Empty add_mesh_peer = 15;
    google.protobuf.Empty remove_mesh_peer = 16;
  }
}

message AgentError {
  string message = 1;
  // error_type/error_detail_json let a typed driver error (see
  // providersdk.ErrorTyper) survive this boundary instead of flattening to
  // a plain string — mirrors CreateCommand.config_json's opaque-JSON
  // rationale above: a new typed error never needs another proto change.
  string error_type = 2;        // e.g. "capacity"; empty = no typed error
  bytes error_detail_json = 3;  // opaque JSON payload for error_type
}

// LogBatch carries only the public diagnostics fields. The server supplies
// the authenticated agent identity instead of trusting a peer-provided one.
message LogBatch {
  repeated LogEvent events = 1;
  // Empty for compatibility with unsolicited batches; populated when this
  // batch answers a server LogRequest.
  string request_id = 2;
}

message LogEvent {
  int64 unix_nano = 1;
  string level = 2;
  string component = 3;
  string message = 4;
  string operation = 5;
  string error_code = 6;
  string error_summary = 7;
  string pool = 8;
  string resource = 9;
  string request = 10;
  string job = 11;
  string step = 12;
  string status = 13;
  int32 attempt = 14;
  // duration_ms is the elapsed time of the operation/step this log entry
  // describes, in milliseconds. Zero means "not reported" — most log
  // entries have no associated duration. Added for #355 so a slow
  // allocation-time guest personalization step is visible through
  // `boxy diagnostics logs` for a remote (non-embedded) agent, not just in
  // the agent's own raw log output.
  int64 duration_ms = 15;
}

// ---- Server -> Agent ----

message ServerMessage {
  oneof payload {
    RegisterResponse registered = 1;  // ack for RegisterRequest
    Command command = 2;
    LogRequest log_request = 3;       // one-time pull of agent-local logs
  }
}

// LogRequest asks an authenticated agent for a bounded slice of its local
// diagnostic history. A zero since_unix_nano requests the retained history.
message LogRequest {
  string request_id = 1;
  int64 since_unix_nano = 2;
  int32 limit = 3;
}

message RegisterResponse {
  string agent_id = 1;
  // client_certificate_pem/client_private_key_pem/ca_certificate_pem are
  // populated only on a token-based (first-time) registration, not on a
  // cert-based reconnect. The private key is generated fresh per agent and
  // sent exactly once here — the server never persists it (see
  // pki.IssueAgentCert and docs/adr/0005-remote-agent-transport-and-registration.md).
  bytes client_certificate_pem = 2;
  bytes client_private_key_pem = 5;
  bytes ca_certificate_pem = 3;
  int32 heartbeat_interval_seconds = 4;
}

message Command {
  string command_id = 1;  // server-generated correlation id
  string provider_type = 2;
  oneof op {
    CreateCommand create = 3;
    ReadCommand read = 4;
    UpdateCommand update = 5;
    DeleteCommand delete = 6;
    AllocateCommand allocate = 7;
    ListCommand list = 8;
    PersonalizeGuestCommand personalize_guest = 9;
    CreateSegmentCommand create_segment = 10;
    AttachToSegmentCommand attach_to_segment = 11;
    DestroySegmentCommand destroy_segment = 12;
    MeshIdentityCommand mesh_identity = 13;
    AddMeshPeerCommand add_mesh_peer = 14;
    RemoveMeshPeerCommand remove_mesh_peer = 15;
  }
}

// config_json/operation_json carry providersdk.Driver's `cfg any` /
// `Operation interface{}` across the wire as opaque, already-JSON-encoded
// bytes rather than typed proto messages, preserving the existing
// per-driver-opaque-config contract instead of coupling the wire schema to
// every current and future driver.
message CreateCommand {
  bytes config_json = 1;
}

message ReadCommand {
  string resource_id = 1;
}

message UpdateCommand {
  string resource_id = 1;
  bytes operation_json = 2;
  bool stream = 3;
}

message DeleteCommand {
  string resource_id = 1;
}

message AllocateCommand {
  string resource_id = 1;
}

// ListCommand requests every resource the driver currently manages for
// provider_type. It carries no fields of its own — enumeration is
// unconditional, unlike the other commands which target one resource_id.
message ListCommand {}

// apply_network marks an allocation-time personalization — a sandbox is
// actually claiming this resource — as opposed to an admission/promotion-time
// one, which must leave it false. It no longer describes in-guest IP
// assignment: a claimed guest is addressed from its sandbox's network segment
// by AttachToSegment instead (#224). What it gates now is anything a driver
// may only do because an allocation is in flight — concretely, the Hyper-V
// driver retains the credential it rotated the guest onto just long enough
// for that allocation's AttachToSegment to authenticate with it, and retains
// nothing for a preheated resource nothing is going to attach. It defaults to
// false (proto3 zero value) so a stale caller — or any code path that forgets
// to set it explicitly — gets the conservative behavior rather than silently
// reintroducing #358's premature provisioning for preheated-but-unclaimed
// inventory. See ADR-0012's 2026-09 change note and ADR-0021's 2026-09-14
// entry.
message PersonalizeGuestCommand {
  string resource_id = 1;
  bool apply_network = 2;
}

// CreateSegmentCommand asks the agent to create a new, empty private
// network segment for one sandbox. See providersdk.NetworkIsolator.
// Idempotent per sandbox_id: a repeat returns the same segment_ref rather
// than creating a second segment.
message CreateSegmentCommand {
  string sandbox_id = 1;
}

// AttachToSegmentCommand asks the agent to move an already-created
// resource onto an existing segment. segment_ref is the opaque value a
// prior CreateSegmentResult returned.
message AttachToSegmentCommand {
  string resource_id = 1;
  string segment_ref = 2;
}

// DestroySegmentCommand asks the agent to tear down a segment created by
// CreateSegmentCommand. Must be idempotent for an already-gone segment,
// matching DeleteCommand's contract.
message DestroySegmentCommand {
  string segment_ref = 1;
}

// MeshIdentityCommand asks the agent for the WireGuard identity of one
// segment, lazily creating its mesh interface if this is the first mesh
// call for it. See providersdk.MeshPeerer.
message MeshIdentityCommand {
  string segment_ref = 1;
}

// AddMeshPeerCommand asks the agent to peer segment_ref's mesh interface
// with a remote peer. The segment's mesh interface must already exist
// (i.e. a MeshIdentityCommand must already have been sent for it).
message AddMeshPeerCommand {
  string segment_ref = 1;
  string peer_public_key = 2;
  string peer_endpoint = 3;
  string peer_cidr = 4;
}

message RemoveMeshPeerCommand {
  string segment_ref = 1;
  string peer_public_key = 2;
}

message ResourceResult {
  string id = 1;
  map<string, string> connection_info = 2;
  map<string, string> metadata = 3;
}

message ResourceStatusResult {
  string id = 1;
  string state = 2;
}

message OperationResult {
  map<string, string> outputs = 1;
}

// OperationStreamEvent carries one provider-neutral event over the existing
// bidirectional agent stream. A complete event terminates the command and may
// include consumer-defined result attributes.
message OperationStreamEvent {
  string channel = 1;
  bytes data = 2;
  bool complete = 3;
  map<string, string> attributes = 4;
  string error = 5;
}

// properties_json carries providersdk.Driver.Allocate's `map[string]any`
// result as opaque JSON bytes rather than a protobuf map, since a protobuf
// map requires a single uniform value type and the Allocate contract does
// not constrain property values to strings (today's drivers happen to only
// produce strings via GuestAccessDetails, but the interface itself allows
// any JSON-representable value).
message AllocateResult {
  bytes properties_json = 1;
}

message ListResult {
  repeated ResourceStatusResult resources = 1;
}

// Empty message (zero-length properties map) means either "driver doesn't
// support guest personalization" or "supported, nothing to report" — both
// collapse to nil client-side, mirroring AllocateResult's existing
// empty-means-nil convention. This is a deliberate, confirmed design choice
// — do not add a "supported" bool.
message PersonalizeGuestResult {
  map<string, string> properties = 1;
  bytes guest_credential_json = 2;
}

message CreateSegmentResult {
  string segment_ref = 1;
}

message MeshIdentityResult {
  string public_key = 1;
  string endpoint = 2;
  string cidr = 3;
}
