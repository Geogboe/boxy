version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: boxy
    main: ./cmd/boxy
    binary: boxy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

# Keyless cosign signing of checksums.txt (#55): no private key is generated
# or stored — cosign gets a short-lived cert from Sigstore's Fulcio CA using
# the release job's GitHub OIDC token (id-token: write in release.yml), signs,
# and publishes a transparency-log entry to Rekor. The .sigstore.json bundle
# published alongside checksums.txt lets consumers verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/Geogboe/boxy/\.github/workflows/release\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# See docs/adr/0014-release-signing-with-keyless-cosign.md.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: true
  make_latest: false
