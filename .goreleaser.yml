version: 2

before:
  hooks:
    - go mod tidy
    # Stages wintun.dll (per Windows arch) + its license into .tmp/wintun/
    # (gitignored, and deliberately NOT under dist/ -- GoReleaser's own
    # "ensuring distribution directory" step fails if dist/ is non-empty
    # by the time it runs, even from a before-hook that ran first), for
    # the windows archive below to include (#379 blocker 6: the mesh
    # overlay's WireGuard device needs it present next to boxy.exe on
    # Windows, and nothing shipped it before this). Hash-verified against a
    # pinned SHA-256 inside the tool itself -- see cmd/wintun-fetch's doc
    # comment for how that pin was chosen and independently verified, and
    # docs/adr/0022's 2026-09-25 changelog entry for the full design. Not a
    # go:generate step: its output is a fetched, hash-verified third-party
    # binary, not something to commit -- the same ephemeral-build-input
    # treatment checksum/cosign already give every other release artifact.
    - go run ./cmd/wintun-fetch -out .tmp/wintun

builds:
  - id: boxy
    main: ./cmd/boxy
    binary: boxy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}
  # Split from the build above (rather than a single boxy build with
  # goos: [linux, darwin, windows]) so the archives block below can target
  # only the Windows binaries via `ids:` -- only a Windows archive needs
  # wintun.dll bundled alongside boxy.exe.
  - id: boxy-windows
    main: ./cmd/boxy
    binary: boxy
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - id: default
    ids: [boxy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
  - id: windows
    ids: [boxy-windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      # strip_parent: the source is .tmp/wintun/<arch>/wintun.dll -- Wintun
      # must sit next to boxy.exe (LoadLibraryEx searches the application
      # directory), so this places it at the archive root, not nested under
      # a wintun/<arch>/ path.
      - src: ".tmp/wintun/{{ .Arch }}/wintun.dll"
        strip_parent: true
      - src: ".tmp/wintun/LICENSE-wintun.txt"
        strip_parent: true

checksum:
  name_template: checksums.txt

# Keyless cosign signing of checksums.txt (#55): no private key is generated
# or stored — cosign gets a short-lived cert from Sigstore's Fulcio CA using
# the release job's GitHub OIDC token (id-token: write in release.yml), signs,
# and publishes a transparency-log entry to Rekor. The .sigstore.json bundle
# published alongside checksums.txt lets consumers verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/Geogboe/boxy/\.github/workflows/release\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# See docs/adr/0014-release-signing-with-keyless-cosign.md.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: true
  make_latest: false
