{{define "title"}}Boxy — Overview{{end}}

{{define "content"}}
<div class="page-header">
  <h1 class="page-title">Overview</h1>
  <button type="button" class="refresh-btn" hx-get="/ui/fragments/stats" hx-target="#stats-fragment" hx-swap="innerHTML" hx-sync="#stats-fragment:replace" aria-label="Refresh now" title="Refresh now">
    <span class="refresh-icon" aria-hidden="true">⟳</span> Refresh
  </button>
</div>
<div id="stats-fragment" class="stats"
     hx-get="/ui/fragments/stats"
     hx-trigger="every 5s"
     hx-swap="innerHTML">
  {{template "stats_fragment" .}}
</div>
{{end}}

{{define "stats_fragment"}}
<div class="stat-card">
  <div class="stat-label">Pools</div>
  <div class="stat-value">{{.PoolCount}}</div>
</div>
<div class="stat-card">
  <div class="stat-label">Sandboxes</div>
  <div class="stat-value">{{.SandboxCount}}</div>
</div>
<div class="stat-card">
  <div class="stat-label">Resources</div>
  <div class="stat-value">{{.ResourceCount}}</div>
</div>
{{end}}
